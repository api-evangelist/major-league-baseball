components:
  schemas:
    OrganizationType:
      type: string
      enum:
      - PLAYER
      - TEAM
      - DIVISION
      - LEAGUE
      - SPORT
      - LEAGUE_LIST
    Platform:
      type: string
      enum:
      - WEB
      - ANDROID_PHONE
      - ANDROID_TABLET
      - IOS_PHONE
      - IOS_TABLET
      - XBOX_ONE
      - XBOX_360
      - ROKU
      - PLAYSTATION
      - CHROMECAST
      - APPLETV
      - TV_OS
    SituationCodeRestObject:
      type: object
      properties:
        copyright:
          type: string
        code:
          type: string
        sortOrder:
          type: integer
          format: int32
        navigationMenu:
          type: string
        description:
          type: string
        team:
          type: boolean
        batting:
          type: boolean
        fielding:
          type: boolean
        pitching:
          type: boolean
    RestObject:
      type: object
      properties:
        copyright:
          type: string
    RunnerDetailType:
      type: string
      enum:
      - START_BASE
      - SEQUENCE
      - RUNNER_GOING
      - END_BASE
      - RUNNER_OUT
      - FORCED_OUT
      - ADVANCED_ON_FORCE
      - ADVANCED_ON_THROW
      - ADVANCED_ON_PLAY
      - DOUBLED_OFF
      - THROWN_OUT
      - TAGGED_OUT
      - OUT_STRETCHING
      - LEFT_EARLY
      - FIELDERS_CHOICE
      - OUT_ON_APPEAL
      - OUT_ADVANCING
      - DEFENSIVE_INDIFFERENCE
      - INTERFERENCE
      - HIT_BY_BATTED_BALL
      - OUT_OVER_RUNNING
      - OUT_RETURNING
      - RUNDOWN
      - CAUGHT_STEALING_2B
      - CAUGHT_STEALING_3B
      - CAUGHT_STEALING_HOME
      - PICKOFF_CAUGHT_STEALING_2B
      - PICKOFF_CAUGHT_STEALING_3B
      - PICKOFF_CAUGHT_STEALING_HOME
      - STOLEN_BASE_2B
      - STOLEN_BASE_3B
      - STOLEN_BASE_HOME
      - PICKOFF_1B
      - PICKOFF_2B
      - PICKOFF_3B
      - PICKOFF_ERROR_1B
      - PICKOFF_ERROR_2B
      - PICKOFF_ERROR_3B
      - UNKNOWN
    ScheduleEventTypeRestObject:
      type: object
      properties:
        copyright:
          type: string
        code:
          type: string
        name:
          type: string
    RoofTypeRestObject:
      type: object
      properties:
        copyright:
          type: string
        value:
          type: string
        description:
          type: string
    LeagueLeaderTypeRestObject:
      type: object
      properties:
        displayName:
          type: string
    StatField:
      type: string
      enum:
      - STANDARD
      - ADVANCED
      - TRACKING
      - EXPECTED
      - SABERMETRICS
      - RANKING
      - PERCENTILE
    TrackingVendor:
      type: string
      enum:
      - SPORTVISION
      - TRACKMAN
      - CHYRONHEGO
      - HAWKEYE
    RuleSettingsRestObject:
      type: object
      properties:
        playSettingId:
          type: integer
          format: int32
        settingId:
          type: integer
          format: int32
        settingName:
          type: string
        settingDisplayName:
          type: string
        settingCategory:
          type: string
        settingCategoryCode:
          type: string
        settingDescription:
          type: string
        settingOptions:
          type: array
          items:
            $ref: '#/components/schemas/RuleSettingsOptionRestObject'
        valueType:
          type: string
        settingValue:
          type: object
        settingScope:
          type: string
        priorityOverride:
          type: integer
          format: int32
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        inherited:
          type: boolean
