      - Config
      summary: List all job types
      operationId: jobTypes
      parameters:
      - name: 'Comma delimited list of specific fields to be returned. Format: topLevelNode, childNode, attribute'
        in: query
        required: false
        schema:
          uniqueItems: true
          type: array
