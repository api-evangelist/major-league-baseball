apis:
- aid: major-league-baseball:mlb-stats-api
  name: MLB Stats API
  description: >-
    The MLB Stats API is the modern statistics and game-data service operated by Major League Baseball.
    It powers official scoreboards, gameday feeds, and downstream applications with endpoints for schedule,
    live game state, box scores, play-by-play, players, teams, standings, venues, divisions, and statistical
    splits. Documentation is hosted at docs.statsapi.mlb.com and access is gated through MLB's identity
    provider for partners.
  humanURL: https://statsapi.mlb.com/
  tags:
  - Game Data
  - Live Scores
  - REST API
  - Sports Statistics
  properties:
  - type: Documentation
    url: https://docs.statsapi.mlb.com/
  - type: APIReference
    url: https://statsapi.mlb.com/
- aid: major-league-baseball:mlb-data-lookup-service
  name: MLB Data Lookup Service API
  description: >-
    The MLB Data Lookup Service is the legacy public data service exposing player search and details,
    hitting and pitching statistics, projections, team lists and rosters, game type information, date
    ranges, transactions, broadcast schedules, injury reports, and statistical leaderboards. The base
    endpoint is lookup-service-prod.mlb.com, with requests formatted as `/json/named.[endpoint].bam`.
  humanURL: https://appac.github.io/mlb-data-api-docs/
  tags:
  - Legacy API
  - Player Data
  - Sports Statistics
  - Team Data
  properties:
  - type: Documentation
    url: https://appac.github.io/mlb-data-api-docs/
  - type: APIReference
    url: http://lookup-service-prod.mlb.com/
- aid: major-league-baseball:mlb-statcast-baseball-savant
  name: MLB Statcast (Baseball Savant)
  description: >-
    Baseball Savant is MLB's public Statcast platform, surfacing pitch- and tracking-level data captured
    by Statcast cameras and radar in every MLB ballpark. It exposes leaderboards, search tools, visualizations,
    and pitch-by-pitch detail for hitters, pitchers, and fielders, and is widely scraped or queried for
    analytical workflows.
  humanURL: https://baseballsavant.mlb.com/
  tags:
  - Pitch Tracking
  - Sports Analytics
  - Statcast
  properties:
  - type: Documentation
    url: https://baseballsavant.mlb.com/
  - type: Leaderboard
    url: https://baseballsavant.mlb.com/statcast_leaderboard
